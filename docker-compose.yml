services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  whatsapp:
    build: .
    command: python -m whatsapp.app
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: on-failure
    volumes:
      - ./data:/app/data
